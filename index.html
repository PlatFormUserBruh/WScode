<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WScode</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand-wrap">
          <div class="logo">WS</div>
          <div class="brand-meta">
            <span class="brand-name">WScode</span>
            <span class="brand-sub">Code, preview, export</span>
          </div>
        </div>

        <div class="toolbar">
          <button class="tool-btn primary" id="runBtn">Run</button>
          <button class="tool-btn" id="resetBtn">Reset</button>
          <button class="tool-btn" id="importBtn">Import</button>
          <button class="tool-btn" id="exportBtn">Export</button>
          <input id="fileInput" type="file" accept=".html,.css,.js,.json,application/json" hidden />
        </div>
      </header>

      <main class="workspace">
        <section class="editor-panel">
          <div class="panel-header">
            <div class="tab-group" role="tablist" aria-label="Code editors">
              <button class="tab active" data-tab="html" role="tab" aria-selected="true">HTML</button>
              <button class="tab" data-tab="css" role="tab" aria-selected="false">CSS</button>
              <button class="tab" data-tab="js" role="tab" aria-selected="false">JS</button>
            </div>
            <div class="panel-actions">
              <button class="mini-btn" id="exportHtmlBtn">HTML</button>
              <button class="mini-btn" id="exportCssBtn">CSS</button>
              <button class="mini-btn" id="exportJsBtn">JS</button>
            </div>
          </div>

          <div class="editor-stack">
            <div class="editor active" data-editor="html">
              <textarea id="htmlEditor" spellcheck="false" aria-label="HTML editor"></textarea>
            </div>
            <div class="editor" data-editor="css">
              <textarea id="cssEditor" spellcheck="false" aria-label="CSS editor"></textarea>
            </div>
            <div class="editor" data-editor="js">
              <textarea id="jsEditor" spellcheck="false" aria-label="JavaScript editor"></textarea>
            </div>
          </div>
        </section>

        <aside class="preview-panel">
          <div class="panel-header preview-header">
            <span>Live Preview</span>
            <span id="statusDot" class="status-dot">●</span>
          </div>
          <iframe id="previewFrame" title="Live preview"></iframe>
        </aside>
      </main>
    </div>

    <script src="script.js"></script>
  </body>
</html>
